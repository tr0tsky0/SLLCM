name: Send your node finds
description: Paste what /sllcm export gave you, so your Leylines and Elemental Convergences go into the next update.
title: "Node finds"
labels: ["nodes"]
body:
  - type: markdown
    attributes:
      value: |
        If you came here from the link in `/sllcm export`, your finds are already filled in below: just press Submit.
        Otherwise, type `/sllcm export` in game, click in the big box (the text is selected), press Ctrl+C and paste it below.
        You don't need to tidy it up. Send it again whenever you've found more.
  - type: textarea
    id: export
    attributes:
      label: Export
      description: Everything from the export window.
      render: lua
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: For example a node you think is in the wrong place.
    validations:
      required: false
